[project]
name = "remote-data"
version = "0.1.0"
description = "Overseas machine data pipeline: fetch ETF data via yahooquery, persist locally, push to remote ingest via HMAC-signed HTTPS."
requires-python = ">=3.11"
dependencies = [
    "yahooquery>=2.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.3",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]